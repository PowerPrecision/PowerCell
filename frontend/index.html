<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F766E" />
    <meta name="description" content="Power Real Estate & Precision Crédito - Sistema de Gestão de Processos" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ============================================================
         GOOGLE FONTS — carregamento NÃO-BLOQUEANTE.
         Padrão media="print" onload="this.media='all'": o browser
         descarrega a stylesheet em paralelo mas NÃO bloqueia a
         renderização. A página aparece imediatamente com fontes de
         sistema (fallback no index.css); quando as fontes Google
         chegam, o browser troca (FOUT) sem erros visíveis.

         Se o CDN (fonts.googleapis.com / fonts.gstatic.com) estiver
         inacessível (ad blockers, firewall corporativa, ISP, DNS),
         a página funciona na mesma com as fontes de sistema.

         Antes: @import url(...) no index.css era RENDER-BLOCKING —
         ERR_CONNECTION_CLOSED no fonts.gstatic.com bloqueava a
         página inteira até timeout.
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap"
          media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" />
    </noscript>

    <title>PowerCell</title>
  </head>
  <body>
    <noscript>Precisa de activar JavaScript para usar esta aplicação.</noscript>
    <div id="root"></div>
    
    <!-- PostHog Analytics — desativado para evitar erros DNS em ambientes restritos -->
    <script>
      // PostHog stub — previne erros quando o domínio não está acessível
      window.posthog = {
        init: function() {},
        capture: function() {},
        identify: function() {},
        reset: function() {},
        register: function() {},
        unregister: function() {},
        setPersonProperties: function() {},
        group: function() {},
        get_distinct_id: function() { return ''; },
        people: { set: function() {}, identify: function() {} },
        _i: [],
        __SV: 1
      };
    </script>
    
    <!-- Entry point do Vite -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
