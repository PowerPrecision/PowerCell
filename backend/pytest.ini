[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio 0.24+ config
asyncio_default_fixture_loop_scope = session

# ====================================================================
# OTIMIZAÇÕES DE PERFORMANCE:
# - Coverage: apenas em CI (desativar local com --no-cov)
# - xdist: paralelismo com -n auto (CI) ou -n 2 (local)
# - Ignorar testes de iteração antigos e E2E
# ====================================================================

# Configuração DEFAULT (sem coverage — para desenvolvimento rápido)
# Em CI, o coverage é ativado via command line: --cov=. --cov-report=term-missing
addopts = -v -p no:warnings \
    --ignore=tests/e2e \
    --ignore-glob=tests/test_iteration*.py \
    --ignore=tests/test_websocket.py \
    --ignore=tests/test_accessibility_apis.py \
    --ignore-glob=tests/integration/test_iteration*.py \
    --ignore-glob=tests/integration/test_excel*.py \
    --ignore=tests/test_chat_and_config_iteration64.py

# Marcadores customizados
markers =
    slow: testes lentos (requerem DB real ou network)
    integration: testes de integração (requerem MongoDB)

# Variáveis de ambiente para teste
env =
    TEST_API_URL=http://testserver/api
    REACT_APP_BACKEND_URL=http://testserver
    MONGODB_URL=mongodb://localhost:27017
    DB_NAME=test_db_precision
    JWT_SECRET=test_secret_key_123
    TESTING=true

# Configuração de cobertura
[coverage:run]
source = .
omit = 
    tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
