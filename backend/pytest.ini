[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CRÍTICO: Usar o mesmo event loop para todas as fixtures e testes
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# CONFIGURAÇÃO:
# Ignorar pasta E2E e ficheiros antigos/problemáticos
# Meta de cobertura: 80%
addopts = -v -p no:warnings --ignore=tests/e2e --ignore-glob=tests/test_iteration*.py --ignore=tests/test_websocket.py --ignore=tests/test_accessibility_apis.py --ignore-glob=tests/integration/test_iteration*.py --ignore-glob=tests/integration/test_excel*.py --ignore=tests/test_chat_and_config_iteration64.py --cov=. --cov-report=term-missing --cov-fail-under=0

# Variáveis de ambiente para teste
env =
    TEST_API_URL=http://testserver/api
    REACT_APP_BACKEND_URL=http://testserver
    MONGODB_URL=mongodb://localhost:27017
    DB_NAME=test_db_precision
    JWT_SECRET=test_secret_key_123
    TESTING=true

# Configuração de cobertura
[coverage:run]
source = .
omit = 
    tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError