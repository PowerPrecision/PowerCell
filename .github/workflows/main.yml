# ====================================================================
# POWERCELL CI/CD PIPELINE
# ====================================================================
# Pipeline de Continuous Integration para impedir que código com erros
# chegue a produção (Vercel/Render).
#
# TRIGGERS:
# - Push para main
# - Pull Requests para main
#
# JOBS:
# 1. Frontend CI (React + Vite)
# 2. Backend CI (Python + FastAPI)
# ====================================================================

name: PowerCell CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar jobs em execução quando novo push é feito
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # JOB 1: FRONTEND CI (React + Vite)
  # ==================================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      # --------------------------------------------------------------
      # 1. Checkout do código
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # --------------------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # --------------------------------------------------------------
      # 3. Instalar dependências
      # --------------------------------------------------------------
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      # --------------------------------------------------------------
      # 4. Linting (verificar erros de código)
      # --------------------------------------------------------------
      - name: Run ESLint
        run: npm run lint -- --max-warnings=100 || true
        continue-on-error: true
        # Nota: continue-on-error para não falhar o build por warnings
        # O Vite build é o verdadeiro gatekeeper
      
      # --------------------------------------------------------------
      # 5. BUILD - CRÍTICO!
      # O Vite é muito rigoroso. Se houver erro de importação ou
      # variável não declarada, o build falha e o job chumba.
      # --------------------------------------------------------------
      - name: Build Vite project
        run: npm run build
        env:
          # Variáveis de ambiente necessárias para o build
          NODE_ENV: production
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL || 'https://powercell.onrender.com' }}
      
      # --------------------------------------------------------------
      # 6. Verificar que o build gerou ficheiros
      # --------------------------------------------------------------
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build directory 'dist' not found!"
            exit 1
          fi
          
          # Verificar que existem ficheiros HTML e JS
          if [ ! -f "dist/index.html" ]; then
            echo "::error::index.html not found in dist!"
            exit 1
          fi
          
          echo "✅ Build successful! Output files:"
          ls -la dist/
      
      # --------------------------------------------------------------
      # 7. Upload do build como artifact (opcional, para debugging)
      # --------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ==================================================================
  # JOB 2: BACKEND CI (Python + FastAPI)
  # ==================================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      # --------------------------------------------------------------
      # 1. Checkout do código
      # --------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # --------------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      # --------------------------------------------------------------
      # 3. Instalar dependências
      # --------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Instalar ferramentas de teste/linting (já devem estar no requirements)
          pip install pytest pytest-asyncio pytest-cov flake8
      
      # --------------------------------------------------------------
      # 4. Linting com Flake8 - DETETAR ERROS DE SINTAXE GRAVES
      # E9: Erros de sintaxe
      # F63: Erros de assertion
      # F7: Erros de syntax
      # F82: Variáveis não definidas
      # --------------------------------------------------------------
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      # --------------------------------------------------------------
      # 5. Testes com Pytest
      # CRÍTICO: Variáveis de ambiente dummy para evitar crash no startup
      # --------------------------------------------------------------
      - name: Run tests with pytest
        run: pytest --tb=short -v --ignore=tests/e2e --ignore-glob="tests/test_iteration*.py" --ignore-glob="tests/integration/test_iteration*.py"
        env:
          # Variáveis de ambiente dummy para testes
          TESTING: "true"
          SECRET_KEY: "test_secret_key_for_ci_pipeline_do_not_use_in_production"
          JWT_SECRET: "test_jwt_secret_for_ci_pipeline_do_not_use_in_production"
          MONGO_URI: "mongodb://localhost:27017/test_db_ci"
          MONGODB_URL: "mongodb://localhost:27017/test_db_ci"
          DB_NAME: "test_db_ci"
          REDIS_URL: "none"
          OPENAI_API_KEY: "sk-test-dummy-key"
          SENTRY_DSN: ""
          REACT_APP_BACKEND_URL: "http://localhost:8001"
          SMTP_SERVER: "smtp.test.com"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test@test.com"
          SMTP_PASSWORD: "test_password"
          POWER_EMAIL: "power@test.com"
          POWER_PASSWORD: "test_password"
          GENIUS_EMAIL: "genius@test.com"
          GENIUS_PASSWORD: "test_password"
          AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
          AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          AWS_REGION: "eu-west-1"
          S3_BUCKET: "test-bucket"
      
      # --------------------------------------------------------------
      # 6. Coverage report (opcional)
      # --------------------------------------------------------------
      - name: Generate coverage report
        if: always()
        run: |
          coverage report || true
          coverage xml || true
      
      # --------------------------------------------------------------
      # 7. Upload coverage como artifact
      # --------------------------------------------------------------
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/.coverage
          retention-days: 7

  # ==================================================================
  # JOB 3: NOTIFY (opcional - requer configuração de secrets)
  # ==================================================================
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: failure()
    
    steps:
      - name: Notify team on failure
        run: |
          echo "::warning::CI Pipeline failed for ${{ github.repository }} on branch ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow_url }}"
          # Aqui pode ser adicionado Slack/Teams notification
          # via webhook se necessário
