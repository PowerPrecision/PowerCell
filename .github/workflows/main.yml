# ====================================================================
# POWERCELL CI/CD PIPELINE
# ====================================================================
# Pipeline de Continuous Integration para impedir que código com erros
# chegue a produção (Vercel/Render).
#
# TRIGGERS:
# - Push para main
# - Pull Requests para main
#
# JOBS:
# 1. Frontend CI (React + Vite)
# 2. Backend CI — Fast (unit tests, ~30s)
# 3. Backend CI — Full (all tests + coverage, ~2min)
# ====================================================================

name: PowerCell CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar jobs em execução quando novo push é feito
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # JOB 1: FRONTEND CI (React + Vite)
  # ==================================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Run ESLint
        run: npm run lint -- --max-warnings=100 || true
        continue-on-error: true
      
      - name: Build Vite project
        run: npm run build
        env:
          NODE_ENV: production
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL || 'https://powercell.onrender.com' }}
      
      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build directory 'dist' not found!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "::error::index.html not found in dist!"
            exit 1
          fi
          echo "✅ Build successful! Output files:"
          ls -la dist/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ==================================================================
  # JOB 2: BACKEND CI — FAST (unit tests sem coverage)
  # ==================================================================
  backend-fast:
    name: Backend CI — Fast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run unit tests (fast, no coverage)
        run: pytest tests/unit/ --tb=short -q --no-header
        env:
          TESTING: "true"
          SECRET_KEY: "test_secret_key_for_ci_pipeline"
          JWT_SECRET: "test_jwt_secret_for_ci_pipeline"
          MONGO_URI: "mongodb://localhost:27017/test_db_ci"
          MONGODB_URL: "mongodb://localhost:27017/test_db_ci"
          DB_NAME: "test_db_ci"
          REDIS_URL: "none"
          OPENAI_API_KEY: "sk-test-dummy-key"
          SENTRY_DSN: ""

  # ==================================================================
  # JOB 3: BACKEND CI — FULL (all tests + coverage + xdist)
  # ==================================================================
  backend-full:
    name: Backend CI — Full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-fast
    
    defaults:
      run:
        working-directory: backend
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run ALL tests with coverage (parallel)
        run: |
          pytest --tb=short -v \
            -n auto \
            --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=0 \
            --ignore=tests/e2e \
            --ignore-glob="tests/test_iteration*.py" \
            --ignore=tests/test_websocket.py \
            --ignore=tests/test_accessibility_apis.py \
            --ignore-glob="tests/integration/test_iteration*.py" \
            --ignore-glob="tests/integration/test_excel*.py" \
            --ignore=tests/test_chat_and_config_iteration64.py
        env:
          TESTING: "true"
          SECRET_KEY: "test_secret_key_for_ci_pipeline_do_not_use_in_production"
          JWT_SECRET: "test_jwt_secret_for_ci_pipeline_do_not_use_in_production"
          MONGO_URI: "mongodb://localhost:27017/test_db_ci"
          MONGODB_URL: "mongodb://localhost:27017/test_db_ci"
          DB_NAME: "test_db_ci"
          REDIS_URL: "none"
          OPENAI_API_KEY: "sk-test-dummy-key"
          SENTRY_DSN: ""
          REACT_APP_BACKEND_URL: "http://localhost:8001"
          SMTP_SERVER: "smtp.test.com"
          SMTP_PORT: "587"
          SMTP_USERNAME: "test@test.com"
          SMTP_PASSWORD: "test_password"
          POWER_EMAIL: "power@test.com"
          POWER_PASSWORD: "test_password"
          GENIUS_EMAIL: "genius@test.com"
          GENIUS_PASSWORD: "test_password"
          AWS_ACCESS_KEY_ID: "AKIAIOSFODNN1EXAMPLE"
          AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          AWS_REGION: "eu-west-1"
          S3_BUCKET: "test-bucket"
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/.coverage
          retention-days: 7

  # ==================================================================
  # JOB 4: NOTIFY (opcional)
  # ==================================================================
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [frontend, backend-fast, backend-full]
    if: failure()
    
    steps:
      - name: Notify team on failure
        run: |
          echo "::warning::CI Pipeline failed for ${{ github.repository }} on branch ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow_url }}"
