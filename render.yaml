# ====================================================================
# RENDER.YAML — PowerCell CRM/Crédito
# ====================================================================
# Configuração do Render via Blueprint (render.yaml).
# Para usar: faz push para o GitHub e o Render deteta automaticamente.
#
# SERVIÇOS:
#   1. backend  — API FastAPI com Playwright (Docker)
#   2. worker   — Processamento assíncrono + scheduler (Docker)
#   3. frontend — React SPA (Static Site)
#
# NOTA: As variáveis sensíveis (secrets) DEVEM ser configuradas
# no Render Dashboard → Environment. O render.yaml só define
# as não-sensíveis. As que dizem (sync: false) são secrets.
# ====================================================================

services:

  # ────────────────────────────────────────────────────────────────
  # 1. BACKEND — API FastAPI + Playwright/Chromium (Docker)
  # ────────────────────────────────────────────────────────────────
  # Usa a imagem oficial Playwright (Python + Chromium pré-instalado).
  # Isto garante que o scraper de Portais Gov funciona em produção.
  # RAM: ~400-500MB (Python + Chromium single-process)
  #
  # IMPORTANTE: O nome do serviço DEVE ser "powercell" para manter
  # o URL https://powercell.onrender.com (evita quebrar links existentes).
  # ────────────────────────────────────────────────────────────────
  - type: web
    name: powercell
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    branch: dev
    healthCheckPath: /health
    numInstances: 1

    envVars:
      # ── Identidade ──
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8001

      # ── Base de Dados (SECRETS) ──
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false

      # ── JWT (SECRET) ──
      - key: JWT_SECRET
        sync: false

      # ── CORS ──
      # Origens explícitas (o regex ALLOW_VERCEL_PREVIEWS cobre *.vercel.app)
      - key: CORS_ORIGINS
        value: https://powercell.onrender.com,https://powercell-1.onrender.com,https://powercell-frontend.onrender.com,https://powercell.pt,https://www.powercell.pt
      # Permitir qualquer subdomínio .vercel.app (previews de branch/PR)
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"

      # ── AWS S3 (SECRETS) ──
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-west-3
      - key: AWS_BUCKET_NAME
        sync: false

      # ── Email (SECRETS) ──
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@powerealestate.pt
      - key: EMAIL_FROM_NAME
        value: "Power Real Estate & Precision Crédito"

      # ── AI / LLM (SECRETS) ──
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # ── Redis / Upstash (SECRETS) ──
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Sentry (SECRETS) ──
      - key: DSN_SENTRY_BACKEND
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

      # ── Playwright ──
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright

      # ── Logging / Anti-Buffering ──
      # PYTHONUNBUFFERED=1 obriga o Python a enviar logs imediatamente
      # para stdout, sem reter em memória. Essencial para o Render capturar
      # logs em tempo real. Já definido no Dockerfile, mas repetido aqui
      # para garantir que funciona mesmo sem Docker (e.g. render start command).
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO

      # ── Uvicorn ──
      # IMPORTANTE: Com 2GB RAM, usar MÁXIMO 2 workers.
      # Com 4 workers, cada um inicia 4 background tasks = 16 tasks = OOM.
      # O server.py agora tem singleton lock para background tasks, mas
      # múltiplos workers ainda duplicam índices DB e consumo base de RAM.
      # Se alterou este valor no Render Dashboard, reverter para 1-2.
      - key: UVICORN_WORKERS
        value: "2"

      # ── Google OAuth (SECRETS) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # ── OneDrive (SECRETS) ──
      - key: ONEDRIVE_TENANT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false

      # ── Trello (SECRETS) ──
      - key: TRELLO_API_KEY
        sync: false
      - key: TRELLO_TOKEN
        sync: false
      - key: TRELLO_BOARD_ID
        sync: false

      # ── VAPID Push Notifications (SECRETS) ──
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false

      # ── Webmail IMAP (SECRETS) ──
      - key: PRECISION_EMAIL
        sync: false
      - key: PRECISION_PASSWORD
        sync: false
      - key: POWER_EMAIL
        sync: false
      - key: POWER_PASSWORD
        sync: false

  # ────────────────────────────────────────────────────────────────
  # 2. WORKER — Tarefas assíncronas + scheduler (Docker)
  # ────────────────────────────────────────────────────────────────
  # Processa: webmail sync, lead matching, trello sync, cleanup.
  # Só arranca quando ENVIRONMENT=production (kill switch interno).
  # RAM: ~200-300MB (Python + lazy loading de módulos pesados)
  #
  # NOTA: Usa um Dockerfile dedicado (Dockerfile.worker) com CMD
  # diferente do backend. O Render não suporta dockerCommand em
  # workers Docker — o CMD do Dockerfile é sempre usado.
  # ────────────────────────────────────────────────────────────────
  - type: worker
    name: powercell-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    branch: dev
    numInstances: 1

    envVars:
      # Herda as mesmas variáveis do backend
      - key: ENVIRONMENT
        value: production
      - key: APP_ENV
        value: production

      # ── Logging / Anti-Buffering ──
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO

      # ── Base de Dados (SECRETS) ──
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false

      # ── JWT (SECRET) ──
      - key: JWT_SECRET
        sync: false

      # ── AWS S3 (SECRETS) ──
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-west-3
      - key: AWS_BUCKET_NAME
        sync: false

      # ── Email (SECRETS) ──
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@powerealestate.pt
      - key: EMAIL_FROM_NAME
        value: "Power Real Estate & Precision Crédito"

      # ── AI / LLM (SECRETS) ──
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # ── Redis / Upstash (SECRETS) ──
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Sentry (SECRETS) ──
      - key: DSN_SENTRY_BACKEND
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

      # ── Playwright ──
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright

      # ── Google OAuth (SECRETS) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

      # ── OneDrive (SECRETS) ──
      - key: ONEDRIVE_TENANT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false

      # ── Trello (SECRETS) ──
      - key: TRELLO_API_KEY
        sync: false
      - key: TRELLO_TOKEN
        sync: false
      - key: TRELLO_BOARD_ID
        sync: false

      # ── Webmail IMAP (SECRETS) ──
      - key: PRECISION_EMAIL
        sync: false
      - key: PRECISION_PASSWORD
        sync: false
      - key: POWER_EMAIL
        sync: false
      - key: POWER_PASSWORD
        sync: false

  # ────────────────────────────────────────────────────────────────
  # 3. FRONTEND — NÃO definido no Blueprint
  # ────────────────────────────────────────────────────────────────
  # O frontend é deployado como Static Site GRATUITO manualmente
  # no Render Dashboard. O tipo static_site foi removido do Blueprint
  # (Render descontinuou-o). Configurar manualmente:
  #   - Build Command: cd frontend && yarn install && yarn build
  #   - Publish Directory: frontend/dist
  #   - Routes: /* → /index.html (SPA rewrite)
  # ────────────────────────────────────────────────────────────────
